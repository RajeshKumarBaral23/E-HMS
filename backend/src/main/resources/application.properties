spring.datasource.url=jdbc:mysql://127.0.0.1:3306/ehealth?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=never
spring.flyway.enabled=false

server.port=8086

# JWT settings
jwt.secret=${JWT_SECRET:dev-secret-please-change-xxxxxxxxxxxxxxxx}
jwt.expirationMs=${JWT_EXPIRATION_MS:86400000}